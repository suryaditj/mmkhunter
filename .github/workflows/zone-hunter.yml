name: Zone Hunter CI & Telegram Bot

on:
  schedule:
    # Antre sesi bot baru tiap 30 menit; concurrency memastikan hanya 1 bot aktif
    - cron: "*/30 * * * *"
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      run_duration_seconds:
        description: "Durasi jalan bot per sesi dalam detik (default: 18000 = 5 jam)"
        required: false
        default: "18000"
      td_rate_limit:
        description: "Batas request Twelve Data per menit (default: 8)"
        required: false
        default: "8"

permissions:
  contents: read

jobs:
  test:
    # Tidak dijalankan saat schedule agar sesi bot tidak tertunda
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: zone-hunter-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit & navigation tests
        env:
          PYTHONPATH: .
        run: python -m pytest -v

  run-bot:
    # Bot hanya via schedule / manual (bukan push) agar tidak ada instance ganda
    if: >-
      ${{ !cancelled()
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 320
    # Group tetap (tanpa ref): hanya 1 bot aktif, 1 run pending; tidak membatalkan bot yang sedang jalan
    concurrency:
      group: zone-hunter-telegram-bot
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram bot for 5 hours (auto-restart via schedule)
        env:
          PYTHONPATH: .
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVE_DATA_RATE_LIMIT_PER_MIN: ${{ github.event.inputs.td_rate_limit || '8' }}
          RUN_DURATION_SEC: ${{ github.event.inputs.run_duration_seconds || '18000' }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TWELVE_DATA_API_KEY" ]; then
            echo "Set TELEGRAM_BOT_TOKEN and TWELVE_DATA_API_KEY in GitHub Repository Secrets."
            exit 1
          fi
          # Jeda agar instance lama sempat berhenti (hindari 429 getMe)
          sleep 30
          timeout --signal=INT --kill-after=30 "$RUN_DURATION_SEC" python run_telegram_bot.py || true
