name: Zone Hunter CI & Telegram Bot

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      run_duration_seconds:
        description: "Durasi jalan bot dalam detik saat manual dispatch (default: 60)"
        required: false
        default: "60"
      td_rate_limit:
        description: "Batas request Twelve Data per menit (default: 8)"
        required: false
        default: "8"

concurrency:
  group: zone-hunter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit & navigation tests
        run: pytest -v

  run-bot:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram bot with bounded timeout
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVE_DATA_RATE_LIMIT_PER_MIN: ${{ inputs.td_rate_limit }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TWELVE_DATA_API_KEY" ]; then
            echo "Set TELEGRAM_BOT_TOKEN and TWELVE_DATA_API_KEY in GitHub Repository Secrets."
            exit 1
          fi
          timeout --signal=INT "${{ inputs.run_duration_seconds }}" python run_telegram_bot.py || true
